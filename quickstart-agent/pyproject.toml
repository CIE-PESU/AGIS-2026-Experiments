[project]
name = "quickstart-agent"
version = "0.1.0"
description = "Quickstart evaluation agent - lite ethics + TIPSC + DFV assessment"
requires-python = ">=3.10"
dependencies = [
    "crewai[litellm]>=1.15.2",
    "crewai-tools>=1.15.1",
    "litellm>=1.91.0",
    "pydantic>=2.11,<2.13",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.0",
    "tavily-python>=0.7.26",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
quickstart = "quickstart_agent.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quickstart_agent*"]

[tool.uv.sources]
quickstart-agent = { path = "." }

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
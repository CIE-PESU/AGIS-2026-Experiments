[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evaluator-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai>=1.15.32,<2",
    "crewai-tools>=1.15.32,<2",
    "langchain-openai>=1.7.1",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "tavily-python>=0.8.5",
    "motor>=3.4",
]

[tool.setuptools.packages.find]
where = ["src"]

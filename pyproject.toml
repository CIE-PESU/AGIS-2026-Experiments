[project]
name = "agis-platform"
version = "1.0.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115.5",
  "uvicorn[standard]>=0.32.1",
  "pydantic>=2.11.9,<2.13",
  "pydantic-settings>=2.15.0,<3",
  "python-dotenv>=1.2.4,<2",
  "motor>=3.7.1,<4",
  "beanie>=1.27.0,<2",
  "pymongo>=4.8.0,<5",
  "PyJWT[crypto]>=2.10.1,<3",
  "cryptography>=50.0.0,<51",
  "httpx>=0.28.1,<0.29",
  "aiokafka>=0.14.0,<1",
  "kafka-python>=3.0.7",
  "crewai[tools]>=1.15.32,<2",
  "crewai-tools>=1.15.32,<2",
  "litellm>=1.106.5,<2",
  "langchain-openai>=1.7.1",
  "tavily-python>=0.8.5",
  "python-multipart>=0.0.32,<1",
  "ulid-py==1.1.0",
  "pyyaml>=6.0,<7"
]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.2.0,<2",
  "pytest-cov>=7.0.0,<8",
  "ruff>=0.13.0,<1",
  "mypy>=1.18.2,<2",
  "pip-audit>=2.9,<3",
  "types-PyYAML>=6",
  "types-requests>=2",
  "playwright>=1.50,<2"
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires isolated MongoDB and Kafka", "smoke: requires running services"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["backend/app/", "backend/tests/"]
plugins = ["pydantic.mypy"]

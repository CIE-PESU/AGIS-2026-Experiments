name: Project checks
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.6
      - run: uv sync --locked --group dev
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked python scripts/check_repository.py
      - run: uv run --locked mypy backend
      - run: uv run --locked pytest -m 'not integration'
      - name: Check generated contracts without developer credentials
        run: uv run --locked python scripts/check_contracts.py
      - name: Check requirements export
        run: |
          uv export --locked --no-dev --no-hashes --format requirements-txt --output-file requirements.txt
          git diff --exit-code -- requirements.txt
      - name: Audit dependencies
        run: uv run --locked python scripts/audit_dependencies.py
  windows:
    runs-on: windows-2022
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: python -m pip install uv==0.13.6
      - run: uv sync --locked --group dev
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked python scripts/check_repository.py
      - run: uv run --locked mypy backend
      - run: uv run --locked pytest -m 'not integration'
      - run: uv run --locked python scripts/check_contracts.py
      - run: uv run --locked python scripts/audit_dependencies.py
  frontend:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: python -m pip install uv==0.13.6
      - run: uv sync --locked --group dev
      - run: npm ci --prefix frontend
      - run: uv run --locked playwright install --with-deps chromium
      - run: docker compose -p agis-tests -f backend/docker-compose.test.yml up -d --wait
      - run: AGIS_INTEGRATION=1 uv run --locked pytest -m integration
      - if: always()
        run: docker compose -p agis-tests -f backend/docker-compose.test.yml down -v

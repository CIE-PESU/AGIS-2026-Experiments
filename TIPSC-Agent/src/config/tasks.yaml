validation_task:
  description: >
    Validate the founder's assumptions and market claims using search.
 
    Founder input:
    {preeval_json}
 
    ---
 
    Your goal: gather just enough search evidence to assess each assumption as
    CONFIRMED, UNCONFIRMED, or CONTRADICTED, and to describe the competitor landscape.
 
    Search budget — MAXIMUM 3 searches total across all assumptions:
    - Combine related assumptions into a single broad query where possible
      (e.g. "IoT predictive maintenance India SME market" covers market size,
      geography, and sector in one go)
    - Do not search each assumption individually if a single query can cover several
    - If you have already found relevant evidence for an assumption from a prior
      search, do NOT search again for that assumption — reuse what you have
    - If search returns nothing, mark the assumption UNCONFIRMED; do not retry
 
    For each assumption, write one sentence stating what was found and the verdict.
    Also write a short competitor landscape paragraph and any market notes.
 
    A separate step will convert your findings to JSON — do NOT produce JSON yourself.
    Stop as soon as you have covered all assumptions (even partially) and the
    competitor landscape. Do not keep searching after your 3-search budget is used.
 
  expected_output: >
    A plain-text research summary: for each assumption, the verdict (CONFIRMED/
    UNCONFIRMED/CONTRADICTED) and one-sentence evidence; a competitor landscape
    paragraph; and market notes relevant to TIPSC scoring.
 


regulatory_task:
  description: >
    Map the startup's geography and industry to applicable regulations.
 
    Founder input:
    {preeval_json}
 
    ---
 
    STEP 1 — Knowledge-based classification:
    Determine if the domain plausibly touches any of these regulated spaces:
    healthcare, finance/fintech, cryptocurrency, data privacy, platform/social,
    consumer safety, employment, food/beverage, AI/synthetic content, or other
    heavily regulated industries.
 
    If NO regulated domain is detected, skip searching and return an empty
    applicable_regulations list immediately.
 
    STEP 2 — If regulated domain detected, search to confirm (max 3 searches):
    - Prefer queries like "[Regulation] [country] 2024 compliance requirements"
    - Check for recent changes (2023+) to any identified regulation
    - Confirm actual compliance burden: HIGH (requires legal/expert team),
      MEDIUM (planned effort by a small team), LOW (standard practice)
    - Identify the key regulatory bodies (RBI, SEBI, MeitY, CERT-In, etc.)
 
    STEP 3 — For each applicable regulation, produce:
    - name: the specific regulation or framework (e.g. "India DPDP Act 2023")
    - jurisdiction: the geography it applies in (e.g. "India", "EU", "Global")
    - compliance_burden: HIGH | MEDIUM | LOW
    - brief_requirement: one sentence — what must this startup do to comply?
 
    If no regulations apply, return applicable_regulations as an empty list.
 
    Return ONLY valid JSON. No markdown. No explanations. No text outside the JSON.
    Every field must be present.
 
    {{
      "target_geography": "...",
      "industry_sector": "...",
      "applicable_regulations": [
        {{
          "name": "...",
          "jurisdiction": "...",
          "compliance_burden": "HIGH|MEDIUM|LOW",
          "brief_requirement": "one sentence"
        }}
      ],
      "regulatory_summary": "one paragraph summarizing the overall regulatory posture",
      "requires_specialist_review": true or false,
      "key_compliance_risks": ["risk 1", "risk 2"]
    }}
 
  expected_output: "Valid JSON matching the RegulatoryOutput schema exactly. No markdown, no extra keys."
 
  
ethics_task:
  description: >
    {ethics_rubric}
 
    ---
 
    Evaluate this idea for ethical concerns:

    {preeval_json}

    ---

    Market Validation Results:
    {validation_context}

    ---
    
    Regulatory Context:
    {regulatory_context}
 
    ---


    Apply the three gates exactly as defined in the rubric above.
    Use ONLY evidence present in the idea, validation results, and regulatory context.
    Do not infer missing facts. Do not block ideas merely because they are in a
    regulated space.
 
    For GATE 2 (LEGAL RISK), use the regulatory context to enrich your verdict:
    - If applicable_regulations includes HIGH-burden items, score YELLOW at minimum
    - If key_compliance_risks exist that block the core business model, consider RED
    - If requires_specialist_review is true, set compliance_flag = true in addition
      to any EthicsOutput logic
    - If no applicable_regulations found, score based on the idea itself alone
 
    Block only if a gate is structurally RED.
 
    Return ONLY valid JSON.

    Rules:
    - harm_vector must be exactly one of: "GREEN", "YELLOW", "RED"
    - legal_risk must be exactly one of: "GREEN", "YELLOW", "RED"
    - problem_solution_integrity must be exactly one of: "GREEN", "RED"

    {{
      "harm_vector": "GREEN",
      "harm_reason": "...",
      "legal_risk": "GREEN",
      "legal_reason": "...",
      "problem_solution_integrity": "GREEN",
      "integrity_reason": "...",
      "ethics_pass": true,
      "compliance_flag": false,
      "rejection_reason": ""
    }}
 
  expected_output: "Valid JSON matching the EthicsOutput schema exactly. No markdown, no extra keys."

tipsc_task:
  description: |
    {tipsc_rubric}

    ------------------------------------------------------

    Startup Information

    {preeval_json}

    ------------------------------------------------------

    Market Validation

    {validation_context}

    ------------------------------------------------------

    Compliance Context

    {compliance_context}

    ------------------------------------------------------

    Previous Founder Follow-up

    {followup_context}

    ------------------------------------------------------

    Your job is to evaluate this startup using the TIPSC framework.

    IMPORTANT:

    Think through the evaluation in the following order.

    STEP 1
    Carefully read ALL available evidence.

    STEP 2
    For each TIPSC dimension (T, I, P, S):

    - Identify supporting evidence.
    - Identify missing evidence.
    - Never invent facts.
    - If evidence is weak, explain why.

    STEP 3

    Evaluate each dimension independently.

    T → Timely

    I → Important

    P → Profitable

    S → Solvable

    ------------------------------------------------------

    SOLVABLE (S) SPECIAL RULE

    If compliance_context contains HIGH burden regulations:

    • A founder can satisfy Solvability through:
      - internal expertise
      - hiring experts
      - legal counsel
      - regulatory consultants
      - partnerships
      - licensed providers

    Lack of personal expertise alone must NOT automatically produce RED.

    ------------------------------------------------------

    RE-EVALUATION RULE

    If followup_context is provided:

    • Treat founder answers as NEW evidence.
    • Re-evaluate affected dimensions.
    • Ignore previous scores.
    • Recompute the overall readiness.

    ------------------------------------------------------

    FOLLOW-UP DECISION

    If one or more dimensions cannot be confidently evaluated because of missing evidence,
    explain the missing evidence internally, but DO NOT ask questions.
    That responsibility belongs to the Follow-up Agent.

    ------------------------------------------------------

    OUTPUT REQUIREMENTS

    Return ONLY valid JSON.

    The JSON object MUST contain EXACTLY these top-level keys:
    - refined_idea
    - solution_alignment
    - tips_validated_metrics
    - tips_rag_scores
    - overall_readiness
    - ready_for_dfv

    Inside refined_idea include:
    - customer_segment
    - qualified_problem
    - consequence
    - proposed_solution

    Inside tips_validated_metrics include:
    - timely_factor
    - importance_metric
    - profitability_pivot
    - solvability_constraint

    Inside tips_rag_scores include:

    - T: GREEN, YELLOW, or RED
    - T_reason: one sentence explaining exactly why T got this score
    - I: GREEN, YELLOW, or RED
    - I_reason: one sentence explaining exactly why I got this score
    - P: GREEN, YELLOW, or RED
    - P_reason: one sentence explaining exactly why P got this score
    - S: GREEN, YELLOW, or RED
    - S_reason: one sentence explaining exactly why S got this score

    Do not rename any key. Do not omit any key.
    Do not return markdown. Do not return explanations.
    Return ONLY the JSON object.
    Also include these three fields at the top level:

    - needs_followup: true if any dimension is RED or YELLOW due to
      missing evidence, false if all dimensions are GREEN
    - missing_criteria: list of dimensions requiring more evidence.
      Example:
        - P
        - S
    - criteria_state: an object mapping each dimension letter to one
      of three values:
        - resolved (for GREEN)
        - weak (for YELLOW)
        - unclear (for RED)
        This above mentioned mapping is just for criteria_state only and not for tips_rag_scores

      Example mapping:
        T -> resolved
        I -> resolved
        P -> weak
        S -> unclear

  expected_output: "Return ONLY valid JSON matching the TIPSCOutput schema. No markdown, no extra keys."

followup_task:
  description: |
    You are the TIPSC Follow-up Agent.

    Your ONLY responsibility is to ask ONE high-value question.

    ------------------------------------------------------

    TIPSC Evaluation

    {tipsc_json}

    ------------------------------------------------------

    Compliance Context

    {compliance_context}

    ------------------------------------------------------

    Previous Conversation

    {followup_context}

    ------------------------------------------------------

    Follow these rules STRICTLY.

    Rule 1

    The Follow-up History contains a section called:

    QUESTIONS ALREADY ASKED

    Treat this list as authoritative.

    Never ask any question that is semantically similar to a question in that list.

    ------------------------------------------------------

    Rule 2

    Only ask about criteria that are currently preventing a stronger TIPSC score.

    ------------------------------------------------------

    Rule 3

    Choose the SINGLE question most likely to change the evaluation.

    ------------------------------------------------------

    Rule 4

    Prefer questions that establish evidence rather than opinions.

    Good examples:

    - Have you spoken to potential customers?
    - How will regulatory compliance be handled?
    - Who will build the product?
    - How will revenue be generated?
    - Have you validated willingness to pay?

    ------------------------------------------------------

    Rule 5

    Never combine multiple questions.

    Only ONE question.

    ------------------------------------------------------

    Rule 6

    If every important missing criterion has already been addressed,

    return

    needs_followup = false

    and

    questions = []

    ------------------------------------------------------

    Rule 7

    If you set needs_followup = true, you MUST provide exactly one question
    in the questions list.

    A response with needs_followup = true and an empty questions list is invalid.

    If you cannot identify a question, set needs_followup = false instead.

    Return ONLY valid JSON matching the FollowUpOutput schema.

  expected_output: "Valid JSON matching the FollowUpOutput schema exactly."
name: Backend CI

on:
  push:
    branches: [develop-backend, "feature/backend/**"]
  pull_request:
    branches: [develop-backend]

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check app/
      - name: ruff format check
        run: ruff format --check app/

  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: mypy
        run: mypy app/ --ignore-missing-imports

  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short \
            --cov=app --cov-report=term-missing \
            --cov-fail-under=0
      - name: Enforce 100% coverage on state_machine/
        run: |
          pytest tests/test_state_machine.py -v \
            --cov=app.state_machine --cov-report=term-missing \
            --cov-fail-under=100

  openapi-validate:
    name: OpenAPI schema check
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Start FastAPI app and fetch /openapi.json
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          SERVER_PID=$!
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/openapi.json -o openapi.json; then
              echo "Fetched openapi.json"
              break
            fi
            echo "Waiting for server... ($i)"
            sleep 1
          done
          kill $SERVER_PID || true
      - name: Validate OpenAPI schema is well-formed
        run: python -m scripts.validate_openapi openapi.json